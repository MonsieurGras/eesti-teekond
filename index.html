<style>
/* Layout: one narrow phone column; a zig-zag path of round lesson nodes grouped by unit bands, full-screen lesson player on top. */
:root{

  --bird:#1E3A6B; --bird-2:#2B5398; --belly:#FFFFFF;
  --u1:#1F6FD1; --u1-d:#1557A8; --u2:#12958A; --u2-d:#0C7168; --u3:#8A4FD8; --u3-d:#6936AE; --u4:#E07F00; --u4-d:#B06300; --u5:#D23F69; --u5-d:#A42D50; --u6:#3D8B37; --u6-d:#2B6927;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151F; --surface:#17212D; --ink:#E9EFF7; --muted:#95A3B6; --line:#2A3748; --line-d:#1D2836;
  --blue:#4A8EE8; --blue-d:#2E68B5; --ok:#3CBF62; --ok-d:#258A43; --ok-bg:#16301F; --bad:#F0626A; --bad-d:#B83C44; --bad-bg:#3A1C20;
  --gold:#F5C22E; --gold-d:#B88E10; --heart:#F2626E; --flame:#FF9C3D; --lock:#2A3646; --lock-d:#1C2633; --lock-ink:#64748A;
  --bird:#3B66B0; --bird-2:#5585D4; --belly:#EEF3FA; color-scheme:dark}}

  --bg:#0E151F; --surface:#17212D; --ink:#E9EFF7; --muted:#95A3B6; --line:#2A3748; --line-d:#1D2836;

  --gold:#F5C22E; --gold-d:#B88E10; --heart:#F2626E; --flame:#FF9C3D; --lock:#2A3646; --lock-d:#1C2633; --lock-ink:#64748A;
  --bird:#3B66B0; --bird-2:#5585D4; --belly:#EEF3FA; color-scheme:dark}

.wlist .w:last-child{border-bottom:none}

.wlist .w .tx{flex:1;min-width:0}
.wlist .w .et{font-weight:900}
.wlist .w .it{color:var(--muted);font-weight:600;font-size:14px}
.spk{border:2px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:34px;display:grid;place-items:center;color:var(--blue);flex:none}

.empty{color:var(--muted);font-weight:700;text-align:center;padding:30px 10px}

/* lesson player */
.player{position:fixed;inset:0;z-index:50;background:var(--surface);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

.pbody{flex:1;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}

.newtag{color:var(--u3);font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.pfoot{border-top:2px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px}
.pfoot .btn{flex:1}

.fb{border-top:none}

.fbin{display:flex;flex-direction:column;gap:12px;width:100%}
.fbt{display:flex;align-items:flex-start;gap:12px}
.fbt .ic{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.fbt .ic svg{width:24px;height:24px}
.fbt h3{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.15}
.fb.good h3,.fb.good .fbtx{color:var(--ok-d)}.fb.wrong h3,.fb.wrong .fbtx{color:var(--bad-d)}

.fbtx{font-weight:800;margin-top:2px}

.speech{display:flex;align-items:flex-end;gap:8px}
.speech .m{width:92px;flex:none}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:22px;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .t{min-width:0}
.listen{display:flex;gap:14px;justify-content:center;padding:10px 0}
.bigspk{width:110px;height:96px;border:none;border-radius:20px;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d);display:grid;place-items:center}
.bigspk svg{width:48px;height:48px}

.bigspk.slow svg{width:32px;height:32px}
.ansline{min-height:116px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);background-image:linear-gradient(var(--line),var(--line));background-size:100% 2px;background-position:0 58px;background-repeat:no-repeat;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:8px 0}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}

textarea{width:100%;min-height:120px;resize:none;border:2px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);font:inherit;font-size:18px;font-weight:700;padding:12px 14px}
.keys{display:flex;gap:8px;flex-wrap:wrap}

.blank{display:inline-block;min-width:76px;border-bottom:3px solid var(--ink);text-align:center;padding:0 6px;color:var(--blue);line-height:1.3}

.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.end h2{font-family:var(--f-display);font-size:32px;margin:0;color:var(--gold-d);line-height:1.1}

.end .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.etile{border:2px solid var(--c);border-radius:14px;overflow:hidden}

.hop{animation:hop .6s ease-out}
@keyframes hop{30%{transform:translateY(-14px) rotate(-4deg)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
.goal{margin-top:14px}
.goalbar{height:14px;background:var(--lock);border-radius:99px;overflow:hidden;margin-top:6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<h4>Niente articoli, niente genere</h4><p>In estone non esistono articoli (né il/la, né un/una) e i nomi non hanno genere.</p>
<h4>L'accento è sulla prima sillaba</h4><p>Quasi sempre: <b>TE</b>-re, <b>AI</b>-täh, <b>PA</b>-lun.</p>
<h4>Le vocali speciali</h4>
<p><b>õ</b>: labbra distese come per «e», lingua arretrata come per «o». È il suono più tipico dell'estone.</p>
<p><b>ä</b>: una «e» molto aperta. <b>ö</b> come in tedesco, <b>ü</b> come la «u» francese.</p>
<h4>Le lettere doppie sono lunghe</h4><p>La durata cambia il significato:</p><div class="ex"><b>sada</b> = cento · <b>saada</b> = manda</div>
<h4>Tere, a ogni ora</h4><p><b>Tere</b> va bene sempre. <b>Tere hommikust / päevast / õhtust</b> sono un po' più formali e legati all'ora del giorno.</p>`,

{t:"Söök ja jook",s:"Cibo e bevande",c:4,guide:`
<h4>Il partitivo: «un po' di»</h4><p>Quando mangi o bevi una quantità indefinita, l'oggetto va al <b>partitivo</b>. Le forme vanno imparate con la parola:</p>
<div class="ex">vesi → <b>vett</b> · kohv → <b>kohvi</b> · tee → <b>teed</b> · leib → <b>leiba</b> · piim → <b>piima</b></div>
<h4>Negazione con ei</h4><p><b>ei</b> + radice del verbo, uguale per tutte le persone. Dopo la negazione l'oggetto va al partitivo:</p><div class="ex">ma <b>ei joo</b> piima · sa <b>ei joo</b> · ta <b>ei joo</b></div>
<h4>Verbi utili</h4><table><tr><td>sööma (mangiare)</td><td>ma söön, sa sööd, ta sööb</td></tr><tr><td>jooma (bere)</td><td>ma joon, sa jood, ta joob</td></tr><tr><td>tahtma (volere)</td><td>ma tahan, sa tahad, ta tahab</td></tr></table>
<h4>Al bar</h4><p>Per ordinare va benissimo il nominativo: <b>Üks kohv, palun.</b></p>`,

const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function liveStreak(){return (S.lastDay===today()||S.lastDay===yesterday())?S.streak:0}
function dailyXp(){return S.daily.d===today()?S.daily.xp:0}
function syncHearts(){
 if(S.hearts>=MAXH){S.heartsTs=Date.now();return}
 const n=Math.floor((Date.now()-S.heartsTs)/HEART_MS);
 if(n>0){S.hearts=Math.min(MAXH,S.hearts+n);S.heartsTs+=n*HEART_MS;if(S.hearts>=MAXH)S.heartsTs=Date.now()}
}
function nextHeartMin(){return Math.max(1,Math.ceil((HEART_MS-(Date.now()-S.heartsTs))/60000))}

const $=(q,el=document)=>el.querySelector(q);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pickN=(a,n)=>shuffle(a).slice(0,n);
const norm=t=>t.toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?¡¿;:"«»()\-]/g," ").replace(/\s+/g," ").trim();
const deacc=t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"");
const ETEQ={ma:"mina",sa:"sina",ta:"tema",me:"meie",te:"teie",nad:"nemad",mu:"minu",su:"sinu"};
const ITPRO=new Set(["io","tu","lui","lei","noi","voi","loro"]);
function canon(t,lang){let k=norm(t).split(" ");if(lang==="et")k=k.map(x=>ETEQ[x]||x);else{if(k.length>1&&ITPRO.has(k[0]))k=k.slice(1);k=k.map(x=>x.replace(/^(dov|com|quant)'?(è|e)$/,"$1e è"))}return k.join(" ")}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>1)return 2;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function judge(input,answers,lang,typed){
 const u=canon(input,lang);
 for(const a of answers) if(canon(a,lang)===u) return {ok:true,kind:"exact"};
 for(const a of answers) if(deacc(canon(a,lang))===deacc(u)) return {ok:true,kind:"accent",a};
 if(typed) for(const a of answers){const c=canon(a,lang); if(c.length>=6&&lev(c,u)<=1) return {ok:true,kind:"typo",a}}
 return {ok:false};
}
function toks(t){return t.replace(/[.,!?;:«»"]/g,"").split(/\s+/).filter(Boolean).map((x,i)=>PROPER.has(x)?x:x.toLowerCase())}

function say(t,slow){if(AUD&&AUD[t]){try{if("speechSynthesis" in window)speechSynthesis.cancel();PLAYER.pause();PLAYER.src=AUD[t];PLAYER.playbackRate=slow?.7:1;PLAYER.preservesPitch=true;PLAYER.currentTime=0;PLAYER.play().catch(()=>{})}catch(e){}return}
 if(!hasVoice()||!("speechSynthesis" in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(etVoice)u.voice=etVoice;u.lang=etVoice?etVoice.lang:"et-EE";u.rate=slow?.55:.9;speechSynthesis.speak(u)}catch(e){}}
let AC=null;
function tone(good){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const now=AC.currentTime;const notes=good?[[660,0],[880,.09]]:[[220,0],[180,.12]];notes.forEach(([fq,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=good?"triangle":"sawtooth";o.frequency.value=fq;g.gain.setValueAtTime(.0001,now+t);g.gain.exponentialRampToValueAtTime(good?.18:.06,now+t+.02);g.gain.exponentialRampToValueAtTime(.0001,now+t+.18);o.connect(g).connect(AC.destination);o.start(now+t);o.stop(now+t+.2)})}catch(e){}}

/* ============ GENERATORE ESERCIZI ============ */
function poolUpTo(ui){const W=[],Sn=[];UNITS.slice(0,ui+1).forEach(u=>u.L.forEach(l=>{W.push(...l.w);Sn.push(...l.s)}));return{W,S:Sn}}
function mkPic(wd,cands){const others=pickN(cands.filter(x=>x.p&&x.e!==wd.e&&x.i!==wd.i),3);return{t:"pic",w:wd,opts:shuffle([wd,...others])}}
function mkPick(wd,cands){return{t:"pick",w:wd,opts:shuffle([wd.e,...pickN(cands.filter(x=>x.e!==wd.e).map(x=>x.e),2)])}}
function mkPickRev(wd,cands){return{t:"pickrev",w:wd,opts:shuffle([wd.i,...pickN(cands.filter(x=>x.i!==wd.i&&!wd.ia.includes(x.i)).map(x=>x.i),2)])}}
function mkMatch(ws){return{t:"match",pairs:ws.map(x=>[x.e,x.i])}}
function mkBuild(sn,dir,pool){
 const toEt=dir!=="e2i";
 const ans=toEt?toks(sn.e):toks(sn.i);
 const src=toEt?pool.S.map(x=>toks(x.e)).flat():pool.S.map(x=>toks(x.i)).flat();
 const low=new Set(ans.map(x=>x.toLowerCase()));
 const dis=pickN([...new Set(src)].filter(x=>!low.has(x.toLowerCase())),Math.min(4,Math.max(2,6-ans.length+2)));
 return{t:"build",dir,sn,tiles:shuffle([...ans,...dis])}
}
function mkType(sn,dir){return{t:"type",dir,sn}}
function mkFill(fl){return{t:"fill",fl,opts:shuffle(fl.o)}}

function buildLesson(node){
 const u=UNITS[node.ui], pool=poolUpTo(node.ui), listen=hasVoice();
 if(node.type==="lesson"){
  const L=u.L[node.li], W=L.w, Sn=L.s, cands=W.concat(u.L.flatMap(x=>x.w));
  const ex=[];
  const pics=pickN(W.filter(x=>x.p),3);
  const rest=[];
  W.filter(x=>!pics.includes(x)).forEach((x,k)=>rest.push(k%2?mkPickRev(x,cands):mkPick(x,cands)));
  if(W.length>=4) rest.push(mkMatch(pickN(W,5)));
  const plan=["e2i","i2e",listen?"listen":"i2e","type-e2i","i2e","type-i2e"];
  Sn.forEach((sn,k)=>{const p=plan[k%plan.length];rest.push(p.startsWith("type")?mkType(sn,p.slice(5)):mkBuild(sn,p,pool))});
  (L.f||[]).forEach(fl=>rest.push(mkFill(fl)));
  pics.forEach(x=>ex.push(mkPic(x,cands)));
  return ex.concat(shuffle(rest)).slice(0,14);
 }
 // ripasso di unità
 const W=u.L.flatMap(l=>l.w), Sn=u.L.flatMap(l=>l.s), F=u.L.flatMap(l=>l.f||[]);
 const ex=[mkMatch(pickN(W,5))];
 pickN(W.filter(x=>x.p),2).forEach(x=>ex.push(mkPic(x,W)));
 pickN(W,2).forEach((x,k)=>ex.push(k?mkPickRev(x,W):mkPick(x,W)));
 const plan=["i2e","type-i2e","e2i",listen?"listen":"i2e","type-e2i","i2e","type-i2e"];
 pickN(Sn,7).forEach((sn,k)=>{const p=plan[k];ex.push(p.startsWith("type")?mkType(sn,p.slice(5)):mkBuild(sn,p,pool))});
 pickN(F,2).forEach(fl=>ex.push(mkFill(fl)));
 return [ex[0],...shuffle(ex.slice(1))];
}
function buildPractice(){
 const doneU=new Set(NODES.filter(n=>S.done[n.id]).map(n=>n.ui));
 const ui=doneU.size?Math.max(...doneU):0;
 const Ls=[];NODES.filter(n=>n.type==="lesson"&&S.done[n.id]).forEach(n=>Ls.push(UNITS[n.ui].L[n.li]));
 if(!Ls.length) Ls.push(UNITS[0].L[0]);
 const W=Ls.flatMap(l=>l.w), Sn=Ls.flatMap(l=>l.s), pool=poolUpTo(ui);
 const ex=[mkMatch(pickN(W,5))];
 pickN(W,2).forEach(x=>ex.push(mkPick(x,W)));
 pickN(Sn,5).forEach((sn,k)=>ex.push(k%2?mkType(sn,"i2e"):mkBuild(sn,k%3?"e2i":"i2e",pool)));
 return ex;
}

 </div></div>

 <div class="sect"><button class="btn ghost danger" data-reset style="color:var(--bad)">Azzera i progressi</button></div>
 </div>`;
}
function render(){
 const body=TAB==="path"?`<div class="wrap">${renderPath()}</div>`:TAB==="words"?`<div class="wrap">${renderWords()}</div>`:`<div class="wrap">${renderMe()}</div>`;
 $("#app").innerHTML=topbar()+`<main>${body}</main>`+navbar();
}

/* ============ FOGLI ============ */
function sheet(html){$("#layer").innerHTML=`<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}
function closeSheet(){$("#layer").innerHTML=""}
function nodeSheet(id){
 const n=NODES.find(x=>x.id===id), gi=NODES.indexOf(n), cur=curIndex(), u=UNITS[n.ui];
 if(gi>cur){toast("Completa prima le lezioni precedenti");return}
 const done=!!S.done[n.id], c=`var(--u${u.c})`, cd=`var(--u${u.c}-d)`;
 const title=n.type==="review"?"Ripasso dell'unità":u.L[n.li].n;
 const sub=n.type==="review"?`Unità ${n.ui+1} · tutte le parole e le frasi`:`Unità ${n.ui+1} · lezione ${n.li+1} di ${u.L.length}`;
 const words=n.type==="review"?u.L.flatMap(l=>l.w).slice(0,10):u.L[n.li].w;
 const xp=n.type==="review"?20:10;
 const noHearts=!S.unlimited&&S.hearts<=0;
 sheet(`<div class="eyebrow">${sub}</div><h3>${esc(title)}</h3><div class="chips">${words.map(x=>`<span class="chip">${esc(x.e)}</span>`).join("")}</div>
 ${noHearts?`<p class="hint">Hai finito i cuori. Il prossimo arriva tra ${nextHeartMin()} min, oppure guadagnane uno con un allenamento.</p><button class="btn ok" data-practice>Esercitati · +1 cuore</button>`
 :`<button class="btn" style="--b:${c};--bd:${cd}" data-start="${id}">${done?"Ripeti":"Inizia"} · +${xp} XP</button>`}`);
}
function guideSheet(ui){const u=UNITS[ui];sheet(`<div class="eyebrow">Guida · Unità ${ui+1}</div><h3>${esc(u.t)}</h3><div class="guide">${u.guide}</div><div style="margin-top:18px"><button class="btn ghost" data-close-btn>Chiudi</button></div>`)}

/* ============ PLAYER LEZIONE ============ */
function start(kind,node){
 closeSheet(); syncHearts();
 const ex=kind==="practice"?buildPractice():buildLesson(node);
 PL={kind,node,queue:ex.slice(),total:ex.length,doneN:0,mist:0,t0:Date.now(),cur:null,sel:null,ans:[],state:"ask",retry:false};
 document.body.style.overflow="hidden";
 nextEx();
}
function quit(){PL=null;document.body.style.overflow="";$("#layer").innerHTML="";render()}
function nextEx(){
 if(!PL.queue.length) return finish();
 if(!S.unlimited&&PL.kind!=="practice"&&S.hearts<=0) return outOfHearts();
 PL.cur=PL.queue.shift(); PL.sel=null; PL.ans=[]; PL.state="ask"; PL.matched=0; PL.mSel=null;
 draw();
 const c=PL.cur;
 if(c.t==="build"&&c.dir!=="i2e") setTimeout(()=>say(c.sn.e),250);
 if(c.t==="type"&&c.dir==="e2i") setTimeout(()=>say(c.sn.e),250);
}
function head(){return `<div class="phead"><button class="xbtn" data-quit aria-label="Esci dalla lezione">${I.x}</button><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${PL.total}" aria-valuenow="${PL.doneN}"><i style="width:${PL.doneN/PL.total*100}%"></i></div>${PL.kind==="practice"||S.unlimited?"":`<span class="stat s-heart">${I.heart}${S.hearts}</span>`}</div>`}
function bubble(text,et){return `<div class="speech"><div class="m">${bird()}</div><div class="bubble">${et&&hasVoice()?`<button class="spk" data-say="${esc(text)}" aria-label="Ascolta">${I.spk}</button>`:""}<span class="t">${esc(text)}</span></div></div>`}
function exBody(){
 const c=PL.cur; const retry=PL.retry?`<div class="newtag" style="color:var(--bad)">Errore precedente</div>`:"";
 switch(c.t){
 case"pic":return `${retry}<h2>Quale di questi significa «${esc(c.w.i)}»?</h2><div class="pics">${c.opts.map((o,k)=>`<button class="pic ${PL.sel===k?"sel":""}" data-sel="${k}"><span class="em">${o.p}</span>${esc(o.e)}</button>`).join("")}</div>`;
 case"pick":return `${retry}<h2>Come si dice «${esc(c.w.i)}»?</h2><div class="opts">${c.opts.map((o,k)=>`<button class="opt ${PL.sel===k?"sel":""}" data-sel="${k}"><span class="k">${k+1}</span>${esc(o)}</button>`).join("")}</div>`;
 case"pickrev":return `${retry}<h2>Che cosa significa?</h2>${bubble(c.w.e,true)}<div class="opts">${c.opts.map((o,k)=>`<button class="opt ${PL.sel===k?"sel":""}" data-sel="${k}"><span class="k">${k+1}</span>${esc(o)}</button>`).join("")}</div>`;
 case"match":{
  if(!c.L){c.L=shuffle(c.pairs.map((p,k)=>({k,t:p[0]})));c.R=shuffle(c.pairs.map((p,k)=>({k,t:p[1]})));c.gone=new Set()}
  const col=(arr,side)=>arr.map(x=>`<button class="mt ${c.gone.has(x.k)?"gone":""} ${PL.mSel&&PL.mSel.side===side&&PL.mSel.k===x.k?"sel":""}" data-m="${side}:${x.k}">${esc(x.t)}</button>`).join("");
  return `<h2>Abbina le coppie</h2><div class="match"><div class="col">${col(c.L,"L")}</div><div class="col">${col(c.R,"R")}</div></div>`}
 case"build":{
  const title=c.dir==="listen"?"Tocca ciò che senti":"Traduci questa frase";
  const prompt=c.dir==="listen"?`<div class="listen"><button class="bigspk" data-say="${esc(c.sn.e)}" aria-label="Ascolta">${I.spk}</button><button class="bigspk slow" data-say-slow="${esc(c.sn.e)}" aria-label="Ascolta lentamente">${I.slow}</button></div>`
   : c.dir==="e2i"?bubble(c.sn.e,true):bubble(c.sn.i,false);
  const used=new Set(PL.ans);
  return `${retry}<h2>${title}</h2>${prompt}<div class="ansline">${PL.ans.map((ti,k)=>`<button class="wt" data-out="${k}">${esc(c.tiles[ti])}</button>`).join("")}</div><div class="bank">${c.tiles.map((t,k)=>`<button class="wt ${used.has(k)?"ghost":""}" data-in="${k}" ${used.has(k)?'tabindex="-1" aria-hidden="true"':""}>${esc(t)}</button>`).join("")}</div>`}
 case"type":{
  const toEt=c.dir==="i2e";
  return `${retry}<h2>${toEt?"Scrivi in estone":"Scrivi in italiano"}</h2>${toEt?bubble(c.sn.i,false):bubble(c.sn.e,true)}<textarea id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${toEt?"Scrivi in estone":"Scrivi in italiano"}"></textarea>${toEt?`<div class="keys">${["õ","ä","ö","ü"].map(k=>`<button data-key="${k}">${k}</button>`).join("")}</div>`:""}`}
 case"fill":{
  const q=esc(c.fl.q).replace("___",`<span class="blank">${PL.sel!=null?esc(c.opts[PL.sel]):"&nbsp;"}</span>`);
  return `${retry}<h2>Completa la frase</h2><div class="fill">${q}</div><p class="hint">${esc(c.fl.i)}</p><div class="opts">${c.opts.map((o,k)=>`<button class="opt ${PL.sel===k?"sel":""}" data-sel="${k}"><span class="k">${k+1}</span>${esc(o)}</button>`).join("")}</div>`}
 }
}
function canCheck(){const c=PL.cur;if(c.t==="build")return PL.ans.length>0;if(c.t==="type"){const t=$("#typed");return t&&t.value.trim().length>0}return PL.sel!=null}
function foot(){
 if(PL.state==="ask"){
  if(PL.cur.t==="match") return `<div class="pfoot"><button class="btn ghost" data-skip>Salta</button></div>`;
  return `<div class="pfoot"><button class="btn ghost skip" data-skip>Salta</button><button class="btn ok" data-check ${canCheck()?"":"disabled"}>Verifica</button></div>`;
 }
 const r=PL.res;
 const good=r.ok;
 const praise=["Ottimo!","Esatto!","Bravo!","Perfetto!","Väga hea!","Tubli!"][Math.floor(Math.random()*6)];
 let title=good?(r.kind==="exact"?praise:"Quasi perfetto"):"Soluzione corretta:";
 let tx="";
 if(good&&r.kind==="accent") tx=`Attento agli accenti: <b>${esc(r.a)}</b>`;
 else if(good&&r.kind==="typo") tx=`Piccolo errore di battitura: <b>${esc(r.a)}</b>`;
 else if(good&&r.show) tx=`<small>Significa:</small>${esc(r.show)}`;
 else if(!good) tx=`${esc(r.right)}${r.mean?`<small>${esc(r.mean)}</small>`:""}`;
 return `<div class="pfoot fb ${good?"good":"wrong"}"><div class="fbin"><div class="fbt"><span class="ic" style="color:var(${good?"--ok":"--bad"})">${good?I.check:I.x}</span><div><h3>${title}</h3>${tx?`<div class="fbtx">${tx}</div>`:""}</div></div><button class="btn ${good?"ok":"bad"}" data-next>Continua</button></div></div>`;
}
function draw(){
 $("#layer").innerHTML=`<div class="player" role="dialog" aria-modal="true" aria-label="Lezione">${head()}<div class="pbody">${exBody()}</div>${foot()}</div>`;
 const t=$("#typed"); if(t){t.focus();t.addEventListener("input",()=>{const b=$("[data-check]");if(b)b.disabled=!canCheck()})}
}
function refreshBody(){$(".pbody").innerHTML=exBody();const ft=$(".pfoot");ft.outerHTML=foot()}
function check(){
 const c=PL.cur; let r;
 if(c.t==="pic"){const o=c.opts[PL.sel];r={ok:o.e===c.w.e,kind:"exact",right:`${c.w.e} = ${c.w.i}`};say(c.w.e)}
 else if(c.t==="pick"){r={ok:c.opts[PL.sel]===c.w.e,kind:"exact",right:c.w.e,mean:c.w.i};say(c.w.e)}
 else if(c.t==="pickrev"){const v=c.opts[PL.sel];r={ok:v===c.w.i||c.w.ia.includes(v),kind:"exact",right:c.w.i}}
 else if(c.t==="fill"){r={ok:c.opts[PL.sel]===c.fl.a,kind:"exact",right:c.fl.q.replace("___",c.fl.a),mean:c.fl.i};say(c.fl.q.replace("___",c.fl.a))}
 else if(c.t==="build"){
  const user=PL.ans.map(k=>c.tiles[k]).join(" ");
  const toEt=c.dir!=="e2i";
  const answers=toEt?[c.sn.e,...c.sn.ea]:[c.sn.i,...c.sn.ia];
  r=judge(user,answers,toEt?"et":"it",false);
  if(r.ok) r.kind="exact";
  r.right=toEt?c.sn.e:c.sn.i; r.mean=toEt?c.sn.i:null;
  if(r.ok&&c.dir==="listen") r.show=c.sn.i;
  if(toEt) say(c.sn.e);
 }
 else if(c.t==="type"){
  const v=$("#typed").value, toEt=c.dir==="i2e";
  const answers=toEt?[c.sn.e,...c.sn.ea]:[c.sn.i,...c.sn.ia];
  r=judge(v,answers,toEt?"et":"it",true);
  r.right=answers[0]; r.mean=toEt?null:null;
  if(toEt) say(c.sn.e);
 }
 PL.res=r; PL.state="fb"; tone(r.ok);
 if(r.ok){PL.doneN++}
 else{
  PL.mist++; PL.queue.push(c); c._retry=true;
  if(!S.unlimited&&PL.kind!=="practice"){S.hearts=Math.max(0,S.hearts-1);if(S.hearts===MAXH-1)S.heartsTs=Date.now();save()}
 }
 draw();
 const m=$(".speech .m"); if(m&&r.ok) m.classList.add("hop");
}
function matchTap(side,k){
 const c=PL.cur;
 if(!PL.mSel||PL.mSel.side===side){PL.mSel={side,k};if(side==="L")say(c.pairs[k][0]);refreshBody();return}
 const a=PL.mSel; PL.mSel=null;
 if(a.k===k){c.gone.add(k);tone(true);if(side==="L")say(c.pairs[k][0]);refreshBody();
  if(c.gone.size===c.pairs.length){PL.doneN++;PL.res={ok:true,kind:"exact"};PL.state="fb";setTimeout(draw,250)}}
 else{tone(false);refreshBody();[`[data-m="${a.side}:${a.k}"]`,`[data-m="${side}:${k}"]`].forEach(q=>{const el=$(q);if(el)el.classList.add("err")})}
}
function cont(){PL.retry=PL.queue.length&&PL.queue[0]._retry;nextEx()}
function outOfHearts(){
 $("#layer").innerHTML=`<div class="player"><div class="end"><div class="m">${bird("sad")}</div><h2 style="color:var(--heart)">Cuori finiti</h2><p>Il prossimo cuore arriva tra ${nextHeartMin()} minuti. Puoi guadagnarne uno subito con un allenamento sulle lezioni già fatte.</p><div style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px"><button class="btn ok" data-practice>Esercitati · +1 cuore</button><button class="btn ghost" data-quit-now>Torna al percorso</button></div></div></div>`;
}
function finish(){
 const n=PL.node, perfect=PL.mist===0;
 let xp=PL.kind==="practice"?5:(n.type==="review"?20:10); if(perfect&&PL.kind!=="practice") xp+=5;
 const before=dailyXp();
 S.xp+=xp; if(S.daily.d!==today()) S.daily={d:today(),xp:0}; S.daily.xp+=xp;
 if(S.lastDay!==today()){S.streak=S.lastDay===yesterday()?S.streak+1:1;S.lastDay=today()}
 S.best=Math.max(S.best||0,S.streak);
 if(PL.kind!=="practice") S.done[n.id]=(S.done[n.id]||0)+1;
 else if(S.hearts<MAXH){S.hearts++;if(S.hearts>=MAXH)S.heartsTs=Date.now()}
 save();
 const acc=Math.round(PL.total/(PL.total+PL.mist)*100), sec=Math.round((Date.now()-PL.t0)/1000);
 const time=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
 const goalHit=before<S.goal&&S.daily.xp>=S.goal;
 const title=PL.kind==="practice"?"Allenamento fatto!":n.type==="review"?"Unità completata!":"Lezione completata!";
 $("#layer").innerHTML=`<div class="player"><div class="end"><div class="m hop">${bird("happy")}</div><h2>${title}</h2>
 <div class="grid3"><div class="etile" style="--c:var(--gold)"><small>XP</small><b>${I.gem.replace("<svg",'<svg width="20" height="20"')}+${xp}</b></div><div class="etile" style="--c:var(--ok)"><small>Precisione</small><b>${acc}%</b></div><div class="etile" style="--c:var(--blue)"><small>Tempo</small><b>${time}</b></div></div>
 <p>${perfect&&PL.kind!=="practice"?"Nessun errore: +5 XP bonus. ":""}${goalHit?"Obiettivo di oggi raggiunto! ":""}${PL.kind==="practice"&&!S.unlimited?"Hai guadagnato un cuore. ":""}Serie: ${S.streak} ${S.streak===1?"giorno":"giorni"}.</p>
 <div style="width:100%;max-width:420px"><button class="btn" data-quit-now>Continua</button></div></div></div>`;
}

/* ============ TRASFERIMENTO ============ */
let PENDING=null;
function exportCode(){const o=Object.assign({},S);delete o.updatedAt;return "ET1:"+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function parseCode(v){try{const m=v.trim().replace(/\s+/g,"");if(!m.startsWith("ET1:"))return null;const o=JSON.parse(decodeURIComponent(escape(atob(m.slice(4)))));if(typeof o!=="object"||typeof o.xp!=="number"||typeof o.done!=="object")return null;return o}catch(e){return null}}
function showCode(c){const t=$("#imp");if(t){t.value=c;t.focus();t.select();toast("Seleziona il testo e copialo")}}
/* ============ EVENTI ============ */
document.addEventListener("click",e=>{
 if(!etVoice)loadVoices();
 const t=e.target.closest("button,[data-close]"); if(!t) return;
 const d=t.dataset;
 if(d.tab){TAB=d.tab;render();window.scrollTo(0,0);return}
 if(d.node){nodeSheet(d.node);return}
 if(d.guide!=null){guideSheet(+d.guide);return}
 if(d.closeBtn!=null){closeSheet();return}
 if(d.close!=null&&e.target===t){closeSheet();return}
 if(d.start){start("lesson",NODES.find(n=>n.id===d.start));return}
 if(d.practice!=null){start("practice",null);return}
 if(d.say){say(d.say);return}
 if(d.saySlow){say(d.saySlow,true);return}
 if(d.goal){S.goal=+d.goal;save();render();return}
 if(d.export!=null){const code=exportCode();const done=()=>toast("Codice copiato");try{navigator.clipboard.writeText(code).then(done,()=>showCode(code))}catch(err){showCode(code)}return}
 if(d.import!=null){const v=($("#imp")||{}).value||"";const r=parseCode(v);if(!r){toast("Codice non valido: incollalo per intero");return}PENDING=r;const n=Object.keys(r.done||{}).length;sheet(`<h3>Importare questi progressi?</h3><p class="hint">${r.xp||0} XP · ${n} lezioni completate · serie ${r.streak||0}. Sostituiranno quelli attuali su questo dispositivo.</p><div style="display:flex;flex-direction:column;gap:12px;margin-top:16px"><button class="btn ok" data-import-ok>Importa</button><button class="btn ghost" data-close-btn>Annulla</button></div>`);return}
 if(d.importOk!=null){if(PENDING){S=Object.assign({},DEF,PENDING,{sound:S.sound,unlimited:S.unlimited,forceTts:S.forceTts||PENDING.forceTts});PENDING=null;save();closeSheet();render();toast("Progressi importati")}return}
 if(d.reset!=null){sheet(`<h3>Azzerare i progressi?</h3><p class="hint">XP, serie e lezioni completate verranno cancellati. Non si può annullare.</p><div style="display:flex;flex-direction:column;gap:12px;margin-top:16px"><button class="btn bad" data-reset-ok>Sì, azzera tutto</button><button class="btn ghost" data-close-btn>Annulla</button></div>`);return}
 if(d.resetOk!=null){S=Object.assign({},DEF,{goal:S.goal,sound:S.sound,unlimited:S.unlimited});save();closeSheet();TAB="path";render();toast("Progressi azzerati");return}
 if(!PL) return;
 if(d.quit!=null){$("#layer").querySelector(".pfoot").outerHTML=`<div class="pfoot"><div class="fbin"><div class="fbt"><span class="ic">${bird("sad").replace("<svg",'<svg width="36"')}</span><div><h3>Vuoi davvero uscire?</h3><div class="fbtx" style="color:var(--muted)">Perderai i progressi di questa lezione.</div></div></div><div style="display:flex;gap:12px"><button class="btn ghost" data-stay>Resta</button><button class="btn bad" data-quit-now>Esci</button></div></div></div>`;return}
 if(d.stay!=null){draw();return}
 if(d.quitNow!=null){quit();return}
 if(PL.state==="ask"){
  if(d.sel!=null){PL.sel=+d.sel;const c=PL.cur;if(c.t==="pic")say(c.opts[PL.sel].e);if(c.t==="pick")say(c.opts[PL.sel]);refreshBody();return}
  if(d.in!=null){PL.ans.push(+d.in);if(PL.cur.dir!=="e2i")say(PL.cur.tiles[+d.in]);refreshBody();return}
  if(d.out!=null){PL.ans.splice(+d.out,1);refreshBody();return}
  if(d.m){const [sd,k]=d.m.split(":");matchTap(sd,+k);return}
  if(d.key){const ta=$("#typed");const p=ta.selectionStart??ta.value.length;ta.value=ta.value.slice(0,p)+d.key+ta.value.slice(ta.selectionEnd??p);ta.focus();ta.selectionStart=ta.selectionEnd=p+1;$("[data-check]").disabled=!canCheck();return}
  if(d.check!=null){if(canCheck())check();return}
  if(d.skip!=null){const c=PL.cur;PL.res={ok:false,right:c.t==="build"||c.t==="type"?(c.dir==="e2i"?c.sn.i:c.sn.e):c.t==="fill"?c.fl.q.replace("___",c.fl.a):c.t==="match"?"Riproveremo più avanti":c.w?c.w.e+" = "+c.w.i:""};PL.state="fb";PL.queue.push(c);c._retry=true;draw();return}
 }
 if(d.next!=null){cont();return}
});
document.addEventListener("change",e=>{
 const id=e.target.id, v=e.target.checked;
 if(id==="sw-sound"){S.sound=v;save();}
 else if(id==="sw-unl"){S.unlimited=v;if(!v)syncHearts();save();render();}
 else if(id==="sw-tts"){S.forceTts=v;save();render();if(v)say("Tere! Kuidas läheb?");}
});
document.addEventListener("keydown",e=>{
 if(!PL) {if(e.key==="Escape")closeSheet();return}
 if(e.key==="Enter"&&!e.shiftKey){
  if(PL.state==="fb"&&$("[data-next]")){e.preventDefault();cont();return}
  if(PL.state==="ask"&&canCheck()&&PL.cur.t!=="match"){e.preventDefault();check();return}
 }
 if(PL.state==="ask"&&/^[1-4]$/.test(e.key)&&["pick","pickrev","fill","pic"].includes(PL.cur.t)&&document.activeElement.tagName!=="TEXTAREA"){const k=+e.key-1;if(k<PL.cur.opts.length){PL.sel=k;refreshBody()}}
});
setInterval(()=>{if(!PL&&!$("#layer").innerHTML){const h=S.hearts;syncHearts();if(S.hearts!==h){save();render()}}},60000);
render();
</script>
